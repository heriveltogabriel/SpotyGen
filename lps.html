<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LP da Semana - Playlists</title>
    <meta name="description" content="Nossas seleções musicais criadas no Spotify pelo SpotyGen.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Style sheet -->
    <link rel="stylesheet" href="lps.css?v=1.1">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header animate-fade-in">
            <div class="logo-container">
                <img src="logo.jpg" alt="LP da Semana Logo" class="logo-img">
            </div>
            <p class="description-title">Do vinil para o streaming: ouça no Spotify o LP da Semana.</p>
        </header>

        <!-- Main Content (Playlists) -->
        <main class="playlists-container animate-fade-in-up">
            <div id="loading-state" class="loading-state">
                <div class="spinner"></div>
                <p>Carregando playlists...</p>
            </div>
            
            <div id="empty-state" class="empty-state hidden">
                <i data-lucide="music-4" class="empty-icon"></i>
                <p>Nenhuma playlist publicada ainda.</p>
            </div>

            <div id="error-state" class="error-state hidden">
                <i data-lucide="alert-triangle" class="error-icon"></i>
                <p>Erro ao carregar as playlists. Tente novamente mais tarde.</p>
            </div>

            <div id="playlists-list" class="playlists-list">
                <!-- Dynamic items go here -->
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Playlists do LP da Semana <i data-lucide="heart" class="heart-icon"></i> <a href="https://www.instagram.com/lpdasemana/" target="_blank" rel="noopener" class="link-instagram">Instagram</a></p>
        </footer>
    </div>

    <script>
        // Fetch playlists from API
        async function fetchPlaylists() {
            const listElement = document.getElementById('playlists-list');
            const loadingElement = document.getElementById('loading-state');
            const emptyElement = document.getElementById('empty-state');
            const errorElement = document.getElementById('error-state');

            try {
                const response = await fetch('/api/playlists');
                if (!response.ok) {
                    throw new Error('Falha na resposta do servidor.');
                }
                const playlists = await response.json();
                
                loadingElement.classList.add('hidden');
                
                if (!playlists || playlists.length === 0) {
                    emptyElement.classList.remove('hidden');
                    return;
                }

                playlists.forEach(pl => {
                    const plElement = document.createElement('a');
                    plElement.href = pl.spotifyUrl;
                    plElement.target = '_blank';
                    plElement.className = 'playlist-card glass-panel';
                    
                    // Fallback to placeholder if cover image doesn't load or is missing
                    const imgUrl = pl.imageUrl || 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300&q=80';
                    
                    plElement.innerHTML = `
                        <div class="card-cover-container">
                            <img src="${imgUrl}" alt="Capa de ${pl.name}" class="card-cover" onerror="this.src='https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300&q=80'">
                            <div class="play-overlay">
                                <i data-lucide="play" class="play-icon"></i>
                            </div>
                        </div>
                        <div class="card-info">
                            <h2 class="card-title">${pl.name}</h2>
                            <p class="card-description">${pl.description || 'Playlist gerada pelo SpotyGen.'}</p>
                        </div>
                        <div class="card-action">
                            <i data-lucide="chevron-right" class="arrow-icon"></i>
                        </div>
                    `;
                    
                    listElement.appendChild(plElement);
                });

                // Initialize Lucide icons
                lucide.createIcons();

            } catch (err) {
                console.error(err);
                loadingElement.classList.add('hidden');
                errorElement.classList.remove('hidden');
            }
        }

        document.addEventListener('DOMContentLoaded', fetchPlaylists);
    </script>
</body>
</html>

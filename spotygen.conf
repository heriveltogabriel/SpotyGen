server {
    listen       80;
    server_name  150.136.84.82.nip.io;
    return 301 https://$host$request_uri;
}

server {
    listen       443 ssl http2;
    listen       [::]:443 ssl http2;
    server_name  150.136.84.82.nip.io;
    root         /usr/share/nginx/html;

    auth_basic "Acesso Restrito - SpotyGen";
    auth_basic_user_file /etc/nginx/.htpasswd;

    ssl_certificate "/etc/letsencrypt/live/150.136.84.82.nip.io/fullchain.pem";
    ssl_certificate_key "/etc/letsencrypt/live/150.136.84.82.nip.io/privkey.pem";
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout  10m;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    include /etc/nginx/default.d/*.conf;

    location / {
        try_files $uri $uri/ =404;
    }

    # Página pública do showcase (LP da Semana)
    location = /lps.html {
        auth_basic off;
        try_files $uri =404;
    }

    # Estilos da página pública
    location = /lps.css {
        auth_basic off;
        try_files $uri =404;
    }

    # Logotipo público
    location = /logo.jpg {
        auth_basic off;
        try_files $uri =404;
    }

    # Proxy para API de persistência das playlists
    location /api/playlists {
        auth_basic off;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Redirecionamento HTTP para HTTPS
server {
    listen       80;
    listen       [::]:80;
    server_name  lpdasemana.com.br www.lpdasemana.com.br 150.136.84.82.nip.io;
    return 301 https://$host$request_uri;
}

# Bloco do Domínio Novo (lpdasemana.com.br)
server {
    listen       443 ssl http2;
    listen       [::]:443 ssl http2;
    server_name  lpdasemana.com.br www.lpdasemana.com.br;
    root         /usr/share/nginx/html;

    ssl_certificate "/etc/letsencrypt/live/lpdasemana.com.br/fullchain.pem";
    ssl_certificate_key "/etc/letsencrypt/live/lpdasemana.com.br/privkey.pem";
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout  10m;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    include /etc/nginx/default.d/*.conf;

    # Página principal pública (a lista de playlists)
    location / {
        try_files $uri $uri/ =404;
    }

    # Painel Gerador Admin (protegido com senha)
    location = /gerador.html {
        auth_basic "Acesso Restrito - SpotyGen Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri =404;
    }

    # Proxy para API de persistência das playlists
    location /api/playlists {
        auth_basic off;
        limit_except GET {
            auth_basic "Acesso Restrito - SpotyGen Admin";
            auth_basic_user_file /etc/nginx/.htpasswd;
        }
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

